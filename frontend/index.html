<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Editor Local</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 16px;
    background: #0f1115;
    color: #e8e8e8;
  }
  h1 { font-size: 1.4rem; }
  p.sub { color: #9aa0a6; margin-top: -8px; }
  .card {
    background: #171a21;
    border: 1px solid #2a2e37;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
  }
  label { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  input[type="file"] { margin-top: 8px; }
  button {
    background: #4f8cff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    margin-top: 12px;
  }
  button.secondary { background: #2a2e37; }
  button:disabled { background: #3a3f4b; cursor: not-allowed; }
  .downloads { margin-top: 16px; display: flex; gap: 12px; }
  .downloads a {
    color: #4f8cff;
    text-decoration: none;
    border: 1px solid #4f8cff;
    padding: 8px 14px;
    border-radius: 8px;
  }
  .video-wrap { position: relative; margin-top: 16px; display: none; max-width: 420px; margin-left: auto; margin-right: auto; }
  .video-wrap video { width: 100%; max-height: 65vh; border-radius: 8px; display: block; background: #000; }
  #subtitleOverlay {
    position: absolute;
    left: 4%;
    right: 4%;
    text-align: center;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 6px #000, 1px 1px 1px #000;
    font-weight: 600;
    line-height: 1.2;
    display: none;
  }
  #resultWrap { margin-top: 18px; }
  #resultWrap video { width: 100%; max-width: 420px; max-height: 65vh; display: block; border-radius: 8px; margin-top: 8px; }
  #steps { list-style: none; padding: 0; margin: 16px 0 0; }
  #steps li {
    padding: 6px 0;
    color: #6a7280;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #steps li.active { color: #ff9f43; font-weight: 600; }
  #steps li.done { color: #4caf78; }
  #steps li.error { color: #d9534f; font-weight: 600; }
  .icon { width: 18px; display: inline-block; text-align: center; }
</style>
</head>
<body>
  <h1>Video Editor Local</h1>
  <p class="sub">Corte de silêncio + legendas automáticas, tudo rodando na sua máquina.</p>
  <p><a href="timeline.html" style="color:#4f8cff;text-decoration:none;">✂ Ir para o editor manual (timeline) &rarr;</a>
  &nbsp;|&nbsp;
  <a href="tools.html" style="color:#4f8cff;text-decoration:none;">🎙 Ferramentas extras (transcrição, texto-pra-voz) &rarr;</a></p>

  <div class="card">
    <input type="file" id="fileInput" accept="video/*" />

    <div class="video-wrap" id="videoWrap">
      <video id="preview" controls></video>
      <div id="subtitleOverlay">Assim vai ficar a legenda</div>
    </div>

    <label><input type="checkbox" id="cutSilence" checked /> Cortar silêncios/pausas</label>
    <label><input type="checkbox" id="removeFillers" /> Remover palavras repetidas e vícios de fala (né, tipo, uhm...)</label>
    <label><input type="checkbox" id="stabilize" /> Estabilizar imagem tremida</label>
    <label><input type="checkbox" id="enhance" checked /> Corrigir cor e normalizar áudio</label>
    <label><input type="checkbox" id="reframe" /> Reframe vertical automático (9:16, segue o rosto)</label>
    <label><input type="checkbox" id="removeBg" /> Remover fundo</label>
    <label id="bgColorLabel" style="display: none; margin-left: 24px;">
      Fundo sólido (deixe em branco para transparente):
      <input type="text" id="bgColor" placeholder="ex: green, #00ff00" style="margin-left: 8px;" />
    </label>
    <label><input type="checkbox" id="upscale" /> Aumentar resolução (2x, nitidez)</label>
    <label><input type="checkbox" id="subtitles" checked /> Gerar legendas automáticas</label>
    <label><input type="checkbox" id="burnIn" checked /> Queimar legendas no vídeo</label>
    <label id="subtitleOptions" style="margin-left: 24px; gap: 16px;">
      Tamanho da fonte:
      <input type="number" id="subtitleFontSize" placeholder="auto" min="8" max="200" style="width: 70px;" />
      Posição:
      <select id="subtitlePosition">
        <option value="bottom" selected>Embaixo</option>
        <option value="middle">Meio</option>
        <option value="top">Em cima</option>
      </select>
    </label>

    <button id="submitBtn">Processar vídeo</button>

    <ul id="steps"></ul>

    <div class="downloads" id="downloads" hidden>
      <a id="downloadVideo" href="#">Baixar vídeo</a>
      <a id="downloadSrt" href="#">Baixar legendas (.srt)</a>
    </div>
    <div id="resultWrap" hidden>
      <strong>Resultado:</strong>
      <video id="resultPreview" controls></video>
      <div>
        <button id="editManuallyBtn" class="secondary" style="margin-top: 10px;">
          ✂ Editar manualmente este resultado
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";

    const fileInput = document.getElementById("fileInput");
    const submitBtn = document.getElementById("submitBtn");
    const stepsEl = document.getElementById("steps");
    const downloadsEl = document.getElementById("downloads");
    const downloadVideoEl = document.getElementById("downloadVideo");
    const downloadSrtEl = document.getElementById("downloadSrt");
    const videoWrap = document.getElementById("videoWrap");
    const previewEl = document.getElementById("preview");
    const subtitleOverlay = document.getElementById("subtitleOverlay");
    const resultWrap = document.getElementById("resultWrap");
    const resultPreviewEl = document.getElementById("resultPreview");
    const removeBgEl = document.getElementById("removeBg");
    const bgColorLabel = document.getElementById("bgColorLabel");
    const subtitlesEl = document.getElementById("subtitles");
    const burnInEl = document.getElementById("burnIn");
    const fontSizeEl = document.getElementById("subtitleFontSize");
    const positionEl = document.getElementById("subtitlePosition");
    const editManuallyBtn = document.getElementById("editManuallyBtn");

    let currentJobId = null;

    removeBgEl.addEventListener("change", () => {
      bgColorLabel.style.display = removeBgEl.checked ? "block" : "none";
    });

    // --- Preview do vídeo + prévia ao vivo da legenda ---------------------

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      previewEl.src = URL.createObjectURL(file);
      videoWrap.style.display = "block";
      resultWrap.hidden = true;
      downloadsEl.hidden = true;
      updateSubtitleOverlay();
    });

    function updateSubtitleOverlay() {
      const showOverlay = subtitlesEl.checked && burnInEl.checked && previewEl.videoHeight > 0;
      subtitleOverlay.style.display = showOverlay ? "block" : "none";
      if (!showOverlay) return;

      const nativeFontSize = Number(fontSizeEl.value) || Math.round(previewEl.videoHeight / 22);
      const scale = previewEl.clientHeight / previewEl.videoHeight;
      const maxPx = previewEl.clientHeight * 0.2;
      subtitleOverlay.style.fontSize = `${Math.min(Math.max(8, nativeFontSize * scale), maxPx)}px`;

      const position = positionEl.value;
      subtitleOverlay.style.top = position === "top" ? "6%" : position === "middle" ? "45%" : "auto";
      subtitleOverlay.style.bottom = position === "bottom" ? "6%" : "auto";
    }

    previewEl.addEventListener("loadedmetadata", updateSubtitleOverlay);
    window.addEventListener("resize", updateSubtitleOverlay);
    [subtitlesEl, burnInEl, positionEl].forEach((el) => el.addEventListener("change", updateSubtitleOverlay));
    fontSizeEl.addEventListener("input", updateSubtitleOverlay);

    // --- Lista de etapas ----------------------------------------------------

    const STEP_DEFS = [
      { key: "cutting_silence", label: "Cortar silêncios/pausas", checkboxId: "cutSilence" },
      { key: "removing_fillers", label: "Remover palavras repetidas/vícios de fala", checkboxId: "removeFillers" },
      { key: "stabilizing", label: "Estabilizar imagem", checkboxId: "stabilize" },
      { key: "enhancing", label: "Corrigir cor e áudio", checkboxId: "enhance" },
      { key: "reframing_vertical", label: "Reframe vertical", checkboxId: "reframe" },
      { key: "removing_background", label: "Remover fundo", checkboxId: "removeBg" },
      { key: "upscaling", label: "Aumentar resolução", checkboxId: "upscale" },
      { key: "transcribing", label: "Transcrever áudio", checkboxId: "subtitles" },
      { key: "generating_subtitles", label: "Gerar legendas", checkboxId: "subtitles" },
    ];

    let activeSteps = [];

    function buildStepList() {
      activeSteps = STEP_DEFS.filter((s) => document.getElementById(s.checkboxId).checked);
      stepsEl.innerHTML = "";
      const allSteps = [{ key: "uploading", label: "Enviar vídeo" }, ...activeSteps, { key: "done", label: "Concluído" }];
      for (const step of allSteps) {
        const li = document.createElement("li");
        li.dataset.key = step.key;
        li.innerHTML = `<span class="icon">○</span> ${step.label}`;
        stepsEl.appendChild(li);
      }
    }

    function setStepState(key, state) {
      const li = stepsEl.querySelector(`li[data-key="${key}"]`);
      if (!li) return;
      li.classList.remove("active", "done", "error");
      const icon = li.querySelector(".icon");
      if (state === "active") { li.classList.add("active"); icon.textContent = "⏳"; }
      else if (state === "done") { li.classList.add("done"); icon.textContent = "✓"; }
      else if (state === "error") { li.classList.add("error"); icon.textContent = "✕"; }
      else { icon.textContent = "○"; }
    }

    function markStepsUpToDone(currentKey) {
      const order = ["uploading", ...activeSteps.map((s) => s.key), "done"];
      const currentIndex = order.indexOf(currentKey);
      order.forEach((key, i) => {
        if (i < currentIndex) setStepState(key, "done");
        else if (i === currentIndex) setStepState(key, "active");
      });
    }

    // --- Envio e acompanhamento do job --------------------------------------

    let lastStatus = "uploading";

    async function pollJob(jobId) {
      let res;
      try {
        res = await fetch(`${API_BASE}/api/jobs/${jobId}`);
      } catch (err) {
        stepsEl.insertAdjacentHTML("beforeend", `<li class="error">Conexão com o servidor perdida. Verifique se ele ainda está rodando.</li>`);
        submitBtn.disabled = false;
        return;
      }
      const job = await res.json();

      if (job.status === "done") {
        markStepsUpToDone("done");
        setStepState("done", "done");
        submitBtn.disabled = false;
        downloadsEl.hidden = false;
        downloadVideoEl.href = `${API_BASE}/api/jobs/${jobId}/video`;
        if (job.result_srt) {
          downloadSrtEl.hidden = false;
          downloadSrtEl.href = `${API_BASE}/api/jobs/${jobId}/subtitles`;
        } else {
          downloadSrtEl.hidden = true;
        }
        resultPreviewEl.src = `${API_BASE}/api/jobs/${jobId}/video`;
        resultWrap.hidden = false;
        currentJobId = jobId;
        return;
      }

      if (job.status === "error") {
        // Não dá pra saber com certeza em qual etapa exata falhou (etapas
        // rápidas podem terminar entre duas consultas de status) — então só
        // marcamos como concluídas as etapas anteriores à última observada,
        // deixamos o resto pendente, e mostramos o erro real por extenso.
        const order = ["uploading", ...activeSteps.map((s) => s.key), "done"];
        const lastIndex = order.indexOf(lastStatus);
        order.forEach((key, i) => { if (i < lastIndex) setStepState(key, "done"); });
        stepsEl.insertAdjacentHTML(
          "beforeend",
          `<li class="error">✕ Falha durante o processamento (depois da etapa "${STEP_DEFS.find((s) => s.key === lastStatus)?.label ?? lastStatus}"). Erro: ${job.error}</li>`
        );
        submitBtn.disabled = false;
        return;
      }

      lastStatus = job.status;
      markStepsUpToDone(job.status);
      setTimeout(() => pollJob(jobId), 2000);
    }

    submitBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert("Selecione um vídeo primeiro.");
        return;
      }

      submitBtn.disabled = true;
      downloadsEl.hidden = true;
      resultWrap.hidden = true;
      buildStepList();
      setStepState("uploading", "active");

      const formData = new FormData();
      formData.append("file", file);
      formData.append("cut_silence_enabled", document.getElementById("cutSilence").checked);
      formData.append("remove_fillers_enabled", document.getElementById("removeFillers").checked);
      formData.append("stabilize_enabled", document.getElementById("stabilize").checked);
      formData.append("enhance_enabled", document.getElementById("enhance").checked);
      formData.append("reframe_enabled", document.getElementById("reframe").checked);
      formData.append("remove_bg_enabled", document.getElementById("removeBg").checked);
      formData.append("background_color", document.getElementById("bgColor").value);
      formData.append("upscale_enabled", document.getElementById("upscale").checked);
      formData.append("subtitles_enabled", document.getElementById("subtitles").checked);
      formData.append("burn_in", document.getElementById("burnIn").checked);
      formData.append("subtitle_font_size", fontSizeEl.value || 0);
      formData.append("subtitle_position", positionEl.value);

      try {
        const res = await fetch(`${API_BASE}/api/jobs`, { method: "POST", body: formData });
        if (!res.ok) {
          setStepState("uploading", "error");
          submitBtn.disabled = false;
          return;
        }

        const job = await res.json();
        pollJob(job.id);
      } catch (err) {
        setStepState("uploading", "error");
        stepsEl.insertAdjacentHTML(
          "beforeend",
          `<li class="error">Não foi possível conectar ao servidor em ${API_BASE}. Verifique se a janela do setup_e_rodar.bat ainda está aberta e rodando.</li>`
        );
        submitBtn.disabled = false;
      }
    });

    editManuallyBtn.addEventListener("click", async () => {
      if (!currentJobId) return;
      editManuallyBtn.disabled = true;
      editManuallyBtn.textContent = "Preparando...";

      try {
        const res = await fetch(`${API_BASE}/api/jobs/${currentJobId}/promote`, { method: "POST" });
        if (!res.ok) {
          alert("Não foi possível abrir este resultado no editor manual.");
          editManuallyBtn.disabled = false;
          editManuallyBtn.textContent = "✂ Editar manualmente este resultado";
          return;
        }
        const info = await res.json();
        window.location.href = `timeline.html?upload_id=${info.upload_id}&duration=${info.duration}`;
      } catch (err) {
        alert("Não foi possível conectar ao servidor.");
        editManuallyBtn.disabled = false;
        editManuallyBtn.textContent = "✂ Editar manualmente este resultado";
      }
    });
  </script>
</body>
</html>
